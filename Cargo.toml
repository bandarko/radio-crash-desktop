[package]
name = "radio-crash-desktop"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Native Radio Crash VFD internet radio receiver"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
cpal = "0.18"
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
rustfft = "6.4"
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication"] }
